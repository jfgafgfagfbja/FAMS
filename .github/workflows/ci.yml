name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: fams
          POSTGRES_PASSWORD: fams123
          POSTGRES_DB: fams
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fams"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://fams:fams123@localhost:5432/fams
        run: pytest -v

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: mobile
        run: flutter test

      - name: Build Flutter web
        working-directory: mobile
        run: flutter build web --release --dart-define=API_BASE_URL=/api

  stack-smoke:
    runs-on: ubuntu-latest
    needs: [backend, mobile]
    steps:
      - uses: actions/checkout@v4

      - name: Build and start docker compose stack
        run: docker compose build backend frontend && docker compose up -d

      - name: Wait for backend and web to answer
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8000/ >/dev/null && curl -sf http://localhost:5173/ >/dev/null; then
              echo "Stack is up"; exit 0
            fi
            sleep 2
          done
          echo "Stack did not become ready in time"
          docker compose logs
          exit 1

      - name: Seed data and check login through nginx /api proxy
        run: |
          docker compose exec -T backend python seed.py
          curl -sf http://localhost:5173/ | grep -q "flutter_bootstrap.js"
          curl -sf -X POST http://localhost:5173/api/auth/login             -d "username=admin@fams.edu.vn&password=admin123" | grep -q refresh_token
          curl -sf -X POST http://localhost:5173/api/auth/login             -d "username=ban01@fams.edu.vn&password=ban12345" | grep -q '"role":"board"'

      - name: Dump docker compose logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down docker compose stack
        if: always()
        run: docker compose down -v
