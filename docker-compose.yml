services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fams}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fams123}
      POSTGRES_DB: ${POSTGRES_DB:-fams}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fams}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fams}:${POSTGRES_PASSWORD:-fams123}@db:5432/${POSTGRES_DB:-fams}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-prod}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "8000:8000"
    volumes:
      - evidence:/app/evidence
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Frontend goi qua nginx proxy /api (xem frontend/nginx.conf), khong goi
        # thang backend:8000 - tranh CORS va lo dia chi noi bo trong production.
        VITE_API_URL: /api
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
  evidence:
