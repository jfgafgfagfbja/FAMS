server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Anh bang chung/anh doi chieu co the lon hon mac dinh 1MB khi upload.
    client_max_body_size 10m;

    # Proxy toan bo goi API (va /evidence/... co chu ky) ve backend - cung origin nen
    # khong can CORS. Ban web duoc build voi API_BASE_URL=/api.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Service worker/bootstrap cua Flutter khong duoc cache lau, tranh ket ban cu sau khi deploy.
    location ~* (flutter_service_worker\.js|flutter_bootstrap\.js|index\.html|version\.json)$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
