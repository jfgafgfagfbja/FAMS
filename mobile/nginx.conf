server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Anh bang chung/anh doi chieu co the lon hon mac dinh 1MB khi upload.
    client_max_body_size 10m;

    # Proxy toan bo goi API (va /evidence/... co chu ky) ve backend - cung origin nen
    # khong can CORS. Ban web duoc build voi API_BASE_URL=/api.
    # ^~ de location regex ben duoi khong cuop cac duong dan API ket thuc bang .json/.js.
    location ^~ /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Ten tep cua Flutter web khong kem ma bam (main.dart.js, flutter_bootstrap.js, manifest...),
    # thieu Cache-Control thi trinh duyet tu doan han cache theo Last-Modified va dung ban cu
    # hang ngay sau khi build lai. no-cache: van cache nhung luon hoi lai (304 neu chua doi).
    location ~* \.(?:html|js|json)$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
