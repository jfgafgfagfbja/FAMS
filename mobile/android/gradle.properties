# Xin 8G heap tren may 16G (lai con chay Docker) lam tien trinh build bi he dieu hanh
# ha giua chung: "Gradle build daemon disappeared unexpectedly". 4G du cho du an nay.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Windows: project (D:) va pub cache (C:) khac o dia lam Kotlin incremental compile loi
# "Could not close incremental caches ... different roots" - tat incremental de build on dinh.
kotlin.incremental=false
